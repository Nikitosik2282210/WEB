<!DOCTYPE html>
<html lang="uk">
<head>

    <title>Практична робота №1 - Розклад</title>

    <header>

    <main>
        <h2>Розклад занять групи</h2>
        
        <!-- Створення таблиці -->

                    <th>День тижня</th>

            </thead>
            <tbody>
                <!-- Понеділок -->
                <tr>
                    <td rowspan="2">Понеділок</td>

                <tr>
                    <td>2</td>

                <!-- Вівторок -->
                <tr>
                    <td rowspan="2">Вівторок</td>
                    <td>1</td>
                    <td>08:30 - 10:05</td>
                    <td>Фізика</td>
                    <td>Сидоров С.С.</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>10:25 - 12:00</td>
